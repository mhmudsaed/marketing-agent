{% extends "base.html" %}

{% block title %}Calendar - Market Agent{% endblock %}

{% block content %}
<section class="chat-hero">
    <div class="hero-copy">
        <p class="microcopy">Publishing plan</p>
        <h1>Calendar</h1>
        <p class="hero-subtitle">A quiet view of approved, scheduled, and published posts from generated campaigns.</p>
    </div>
    <aside class="recent-card">
        <div class="recent-card-head"><span>Visible posts</span><strong>{{ posts|length }}</strong></div>
        <button class="btn" onclick="changeMonth(-1)">Previous</button>
        <button class="btn" onclick="changeMonth(1)">Next</button>
    </aside>
</section>

<section class="calendar-shell">
    <h2 id="month-label"></h2>
    <div class="calendar-grid" id="calendar-grid"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
let currentDate = new Date();
const posts = {{ posts | tojson }};
const campaigns = {{ campaigns | tojson }};

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();
    document.getElementById('month-label').textContent = new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<div></div>';
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayPosts = posts.filter((post) => post.date === dateStr);
        html += `<div class="calendar-day"><strong>${day}</strong>`;
        dayPosts.forEach((post) => {
            const campaign = campaigns.find((item) => item.id === post.campaign_id);
            html += `<a class="post-chip" href="/campaign/${post.campaign_id}">${post.channel || 'Post'}: ${(post.title || campaign?.name || 'Untitled').slice(0, 28)}</a>`;
        });
        html += '</div>';
    }
    document.getElementById('calendar-grid').innerHTML = html;
}

function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
}

renderCalendar();
</script>
{% endblock %}
